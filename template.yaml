AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MySQL admin API on Lambda and API Gateway HTTP API

Parameters:
  SubnetIds:
    Type: String
    Default: ""
    Description: Comma-separated private subnet IDs for private RDS; leave empty for a publicly reachable database
  SecurityGroupIds:
    Type: String
    Default: ""
    Description: Comma-separated Lambda security group IDs; required when SubnetIds is set

Conditions:
  UseVpc: !Not [!Equals [!Ref SubnetIds, ""]]

Rules:
  VpcRequiresSecurityGroups:
    RuleCondition: !Not [!Equals [!Ref SubnetIds, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SecurityGroupIds, ""]]
        AssertDescription: SecurityGroupIds must be supplied with SubnetIds.

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1033]
    Properties:
      CodeUri: server/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 28
      Policies:
        - AWSLambdaBasicExecutionRole
        - !If [
            UseVpc,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole",
            !Ref "AWS::NoValue",
          ]
      VpcConfig: !If
        - UseVpc
        - SubnetIds: !Split [",", !Ref SubnetIds]
          SecurityGroupIds: !Split [",", !Ref SecurityGroupIds]
        - !Ref AWS::NoValue
      # Runtime environment variables are managed in the Lambda console.
      # Keep Environment out of this template to avoid managing console values.
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Set this value as VITE_API_URL in Amplify
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api"
  FunctionName:
    Value: !Ref ApiFunction
